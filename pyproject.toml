[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibd-microbiome-transferability-benchmark"
version = "0.1.0"
description = "Leakage-audited source-to-target IBD microbiome transfer benchmark"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
benchmark = ["xgboost>=2.0"]
third-cohort = ["rdata>=1.0", "xarray>=2024.1"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
